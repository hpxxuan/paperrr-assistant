<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperrr✷ 2.0 | 計畫助理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; background-color: #FFF9FA; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 請在此處填入您的 Firebase SDK 配置
        const firebaseConfig = {
            apiKey: "您的API_KEY",
            authDomain: "您的專案.firebaseapp.com",
            projectId: "您的專案ID",
            storageBucket: "您的專案.appspot.com",
            messagingSenderId: "您的傳送者ID",
            appId: "您的APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'paperrr-v2-tags-sync';

        const App = () => {
            const [tasks, setTasks] = useState([]);
            const [tags, setTags] = useState([]);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());

            const weekNames = ["一", "二", "三", "四", "五", "六", "日"];

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    if (!u) auth.signInAnonymously();
                    setUser(u);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubTasks = db.collection(`artifacts/${appId}/users/${user.uid}/tasks`)
                    .onSnapshot(snap => setTasks(snap.docs.map(doc => ({ ...doc.data(), id: doc.id }))));
                return unsubTasks;
            }, [user]);

            // 日期顯示邏輯：05 / 12 (二)
            const renderDateLabel = (dateStr) => {
                const d = new Date(dateStr);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dayName = weekNames[(d.getDay() + 6) % 7];
                return (
                    <div className="flex items-center gap-6">
                        <span className="font-black text-pink-500 text-[14px]">{mm} / {dd}</span>
                        <span className="font-medium text-pink-300 text-[14px]">（{dayName}）</span>
                    </div>
                );
            };

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <header className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-black text-slate-800">計畫中心✦</h1>
                        <div className="flex bg-white rounded-full p-1 shadow-sm border border-pink-50">
                            {['month', 'week'].map(v => (
                                <button key={v} onClick={() => setView(v)} className={`px-6 py-2 rounded-full text-xs font-black transition-all ${view === v ? 'bg-pink-500 text-white shadow-md' : 'text-slate-400'}`}>
                                    {v === 'month' ? '月概覽' : '週執行'}
                                </button>
                            ))}
                        </div>
                    </header>

                    {view === 'month' ? (
                        <div className="space-y-6">
                            <h3 className="text-xl font-black text-slate-700 px-2">計畫規劃✦</h3>
                            <div className="space-y-3">
                                {tasks
                                    .filter(t => !t.isUnplanned)
                                    .sort((a, b) => new Date(a.startDate) - new Date(b.startDate)) // 關鍵：依照日期排序
                                    .map(t => (
                                        <div key={t.id} className="bg-white p-5 rounded-[2rem] border border-pink-50 flex items-center shadow-sm hover:shadow-md transition-all">
                                            <div className="bg-pink-50/50 px-5 py-2 rounded-2xl mr-6">
                                                {renderDateLabel(t.startDate)}
                                            </div>
                                            <div className="font-bold text-slate-700 flex-1">{t.title}</div>
                                        </div>
                                    ))}
                            </div>
                        </div>
                    ) : (
                        /* 週度執行：完成反灰但不槓線 */
                        <div className="space-y-4">
                            {tasks.filter(t => t.startDate === currentDate.toISOString().split('T')[0]).map(t => (
                                <div key={t.id} className="flex items-center gap-4 p-5 bg-white rounded-3xl border border-pink-50">
                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${t.completed ? 'bg-pink-500 border-pink-500 text-white' : 'border-pink-200'}`}>
                                        {t.completed && "✓"}
                                    </div>
                                    <span className={`font-bold flex-1 ${t.completed ? 'text-slate-400' : 'text-slate-700'}`}>{t.title}</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
