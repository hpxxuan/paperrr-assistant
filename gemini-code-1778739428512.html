<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperrr✷ 2.0 | 計畫助理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; background-color: #FFF9FA; color: #334155; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-shadow { box-shadow: 0 10px 40px -10px rgba(255, 182, 193, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. Firebase 配置 (請在此處填入您的資訊) ---
        const firebaseConfig = {
            apiKey: "您的_API_KEY",
            authDomain: "您的專案ID.firebaseapp.com",
            projectId: "您的專案ID",
            storageBucket: "您的專案ID.appspot.com",
            messagingSenderId: "您的發送者ID",
            appId: "您的應用程式ID"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'paperrr-v2-tags-sync';

        // --- 2. 核心組件 ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [tasks, setTasks] = useState([]);
            const [tags, setTags] = useState([]);
            const [view, setView] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const weekNames = ["一", "二", "三", "四", "五", "六", "日"];

            // 認證與數據同步
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    if (!u) auth.signInAnonymously();
                    setUser(u);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubTasks = db.collection(`artifacts/${appId}/users/${user.uid}/tasks`)
                    .onSnapshot(snap => setTasks(snap.docs.map(doc => ({ ...doc.data(), id: doc.id }))));
                const unsubTags = db.collection(`artifacts/${appId}/users/${user.uid}/tags`)
                    .onSnapshot(snap => setTags(snap.docs.map(doc => ({ ...doc.data(), id: doc.id }))));
                return () => { unsubTasks(); unsubTags(); };
            }, [user]);

            // --- 3. 視覺處理邏輯 ---
            
            // 下午 3:33 的日期格式：05 / 12      (二)
            const renderDateLabel = (dateStr) => {
                const d = new Date(dateStr);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const dayName = weekNames[(d.getDay() + 6) % 7];
                return (
                    <div className="flex items-center">
                        <span className="font-black text-pink-500 text-[14px]">{mm} / {dd}</span>
                        <span className="w-8"></span> {/* 寬間距 */}
                        <span className="font-medium text-pink-300 text-[14px]">({dayName})</span>
                    </div>
                );
            };

            // 月度概覽 (圖一：藥丸風格)
            const renderMonth = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
                
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let i = 1; i <= daysInMonth; i++) days.push(new Date(year, month, i));

                return (
                    <div className="space-y-8 animate-in fade-in">
                        <div className="bg-white p-6 rounded-[2.5rem] custom-shadow border border-pink-50">
                            <div className="grid grid-cols-7 mb-4 border-b border-pink-50 pb-2">
                                {weekNames.map(w => <div key={w} className="text-center text-[11px] font-black text-orange-300">{w}</div>)}
                            </div>
                            <div className="grid grid-cols-7 gap-px bg-slate-50 border border-slate-50 rounded-2xl overflow-hidden">
                                {days.map((day, idx) => {
                                    const dayStr = day ? day.toISOString().split('T')[0] : null;
                                    const dayEvents = tasks.filter(t => !t.isUnplanned && (t.startDate === dayStr || (dayStr >= t.startDate && dayStr <= t.endDate)));
                                    return (
                                        <div key={idx} className="min-h-[110px] bg-white p-1 relative border-r border-b border-slate-50">
                                            {day && (
                                                <>
                                                    <span className="text-[10px] font-black text-slate-300 ml-1">{day.getDate()}</span>
                                                    <div className="space-y-1 mt-1">
                                                        {dayEvents.slice(0, 3).map(ev => (
                                                            <div key={ev.id} className="text-[10px] font-bold px-2 py-1 rounded-lg text-white truncate shadow-sm opacity-85" style={{ backgroundColor: tags.find(tg => tg.id === ev.tagId)?.color || '#FF82BA' }}>
                                                                {ev.time && <span className="mr-1 opacity-70">{ev.time}</span>}{ev.title}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 計畫規劃清單 - 依照日期排序 */}
                        <div className="space-y-4">
                            <h3 className="text-xl font-black text-slate-800 px-2 flex items-center gap-2">計畫規劃✦</h3>
                            <div className="space-y-3">
                                {tasks
                                    .filter(t => !t.isUnplanned)
                                    .sort((a, b) => new Date(a.startDate) - new Date(b.startDate))
                                    .map(t => (
                                        <div key={t.id} className="bg-white p-4 px-6 rounded-3xl border border-pink-50 flex items-center group hover:scale-[1.01] transition-all cursor-pointer">
                                            <div className="shrink-0 mr-8 bg-pink-50/50 py-2 px-5 rounded-2xl">
                                                {renderDateLabel(t.startDate)}
                                            </div>
                                            <div className="font-bold text-slate-700 flex-1 truncate">{t.title}</div>
                                        </div>
                                    ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // 週度執行 (完成反灰不槓線)
            const renderWeek = () => {
                const todayStr = currentDate.toISOString().split('T')[0];
                const dayTasks = tasks.filter(t => t.startDate === todayStr);

                return (
                    <div className="space-y-6">
                        <div className="bg-white p-8 rounded-[3rem] custom-shadow border border-pink-50">
                            <h3 className="text-2xl font-black text-slate-800 mb-8">今日計畫追蹤✦</h3>
                            <div className="space-y-4">
                                {dayTasks.map(t => (
                                    <div key={t.id} className="flex items-center gap-5 p-6 bg-slate-50/50 rounded-3xl border border-slate-100">
                                        <button onClick={() => db.collection(`artifacts/${appId}/users/${user.uid}/tasks`).doc(t.id).update({completed: !t.completed})} 
                                            className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all ${t.completed ? 'bg-pink-500 border-pink-500 text-white' : 'border-pink-200'}`}>
                                            {t.completed && "✓"}
                                        </button>
                                        <div className="flex-1">
                                            <h4 className={`font-black text-lg transition-all ${t.completed ? 'text-slate-400' : 'text-slate-700'}`}>
                                                {t.title}
                                            </h4>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-10 pb-20">
                    <header className="flex flex-col md:flex-row items-center justify-between gap-6 mb-12">
                        <div className="flex items-center gap-4">
                            <div className="bg-pink-500 p-4 rounded-3xl text-white shadow-xl shadow-pink-100 font-black text-2xl">P</div>
                            <div>
                                <h1 className="text-3xl font-black text-slate-800 tracking-tighter">Paperrr✷ 2.0</h1>
                                <p className="text-[10px] font-black text-pink-400 uppercase tracking-widest">Cloud Sync Plan Assistant</p>
                            </div>
                        </div>
                        <div className="flex gap-2 bg-white p-2 rounded-[2rem] border border-pink-50 shadow-md">
                            {['month', 'week'].map(v => (
                                <button key={v} onClick={() => setView(v)} className={`px-8 py-2.5 rounded-3xl text-[12px] font-black transition-all ${view === v ? 'bg-pink-500 text-white shadow-lg' : 'text-slate-400 hover:bg-pink-50'}`}>
                                    {v === 'month' ? '月度概覽' : '週度執行'}
                                </button>
                            ))}
                        </div>
                    </header>

                    {view === 'month' ? renderMonth() : renderWeek()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
